kind = "web"
previewPath = "/"
title = "Glam Studio"
version = "1.0.0"
id = "artifacts/glam-studio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21128

[services.development]
run = "pnpm --filter @workspace/glam-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/glam-studio", "run", "build" ]
publicDir = "artifacts/glam-studio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21128"
BASE_PATH = "/"
